[project]
name = "text2sql-grpo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "sqale==0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql_grpo"]